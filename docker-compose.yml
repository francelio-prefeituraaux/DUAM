services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: duam_api
      MYSQL_USER: duam_api
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?informe MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?informe MYSQL_ROOT_PASSWORD no .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Automacao.DuamApi/Automacao.DuamApi
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DuamMySql: "Server=mysql;Port=3306;Database=duam_api;User=duam_api;Password=${MYSQL_PASSWORD};"
      Armazenamento__DiretorioPlanilhas: /data/planilhas
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "8080:8080"
    volumes:
      - planilhas_data:/data/planilhas

  web:
    build:
      context: ./Automacao.DuamApi.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  mysql_data:
  planilhas_data:
